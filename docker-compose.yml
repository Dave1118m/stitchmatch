version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: stitchmatch_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password_123}
      MYSQL_DATABASE: stitchmatch
      MYSQL_USER: ${DB_USER:-stitchmatch_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stitchmatch_secure_pass_123}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - stitchmatch_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API & WebSocket Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitchmatch_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${DB_USER:-stitchmatch_user}:${DB_PASSWORD:-stitchmatch_secure_pass_123}@mysql:3306/stitchmatch
      JWT_SECRET: ${JWT_SECRET:-generate_a_random_64_character_string_here}
      JWT_PHOTO_SECRET: ${JWT_PHOTO_SECRET:-generate_a_different_random_64_character_string_here}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - stitchmatch_network

volumes:
  mysql_data:
  uploads_data:

networks:
  stitchmatch_network:
    driver: bridge
