# ==========================================
# StitchMatch Production Nginx Configuration
# ==========================================

# Rate limiting zone (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 1. HTTP to HTTPS Redirection Block (Enable when domain & SSL are ready)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourtailordomain.com www.yourtailordomain.com;
#     return 301 https://$host$request_uri;
# }

# 2. Main Server Block
server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2; # Uncomment when SSL is active
    # listen [::]:443 ssl http2;

    server_name yourtailordomain.com www.yourtailordomain.com localhost;

    # SSL Certificates (Managed automatically by Certbot)
    # ssl_certificate /etc/letsencrypt/live/yourtailordomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourtailordomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Root directory pointing to compiled frontend build
    root /var/www/stitchmatch/frontend/dist;
    index index.html;

    # Client body size for file uploads (max 15MB)
    client_max_body_size 15M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Static Uploaded Files
    location /uploads/ {
        alias /var/www/stitchmatch/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # 2. Backend REST API Endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Socket.IO Real-Time WebSockets & WebRTC Signaling
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Frontend Single Page Application (SPA) Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
