<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle luxury rounded shape -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Outer Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#purple)" stroke-width="4" opacity="0.3"/>

  <!-- AI Measuring Grid Accents -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Tailor Needle & Thread Swirl -->
  <path d="M 140 370 Q 256 460 380 340 Q 460 220 330 160 Q 230 110 180 200 Q 140 280 256 290 Q 340 300 370 240" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Center Scissors Emblem -->
  <g transform="translate(256, 240)" filter="url(#glow)">
    <!-- Scissor Loop 1 (Left) -->
    <circle cx="-54" cy="70" r="32" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <!-- Scissor Loop 2 (Right) -->
    <circle cx="54" cy="70" r="32" fill="none" stroke="url(#gold)" stroke-width="14"/>

    <!-- Left Blade -->
    <path d="M -32 50 L 50 -105 L 35 -115 L -45 35 Z" fill="url(#gold)"/>
    <!-- Right Blade -->
    <path d="M 32 50 L -50 -105 L -35 -115 L 45 35 Z" fill="url(#gold)"/>

    <!-- Pivot Pin -->
    <circle cx="0" cy="-20" r="10" fill="#ffffff" stroke="url(#gold)" stroke-width="4"/>
    
    <!-- AI Sparkle at Blade Intersection -->
    <path d="M 0 -75 L 4 -60 L 19 -56 L 4 -52 L 0 -37 L -4 -52 L -19 -56 L -4 -60 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    STITCHMATCH
  </text>
</svg>
